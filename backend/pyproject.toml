[build-system]
requires = ["setuptools>=78"]
build-backend = "setuptools.build_meta"

[project]
name = "tracynth-backend"
version = "0.1.0"
description = "Tracynth private investigation API"
requires-python = ">=3.12"
dependencies = [
  "Django>=5.2,<5.3",
  "djangorestframework>=3.16,<3.19",
  "celery[redis]>=5.5,<5.6",
  "dj-database-url>=2.3,<3",
  "psycopg[binary]>=3.2,<4",
  "argon2-cffi>=23.1,<26",
  "gunicorn>=23,<24; platform_system != 'Windows'",
  "cryptography>=45,<47",
  "dnspython>=2.7,<3",
  "httpcore==1.0.9",
  "httpx>=0.28,<0.29",
  "whitenoise>=6.12,<6.13",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-django>=4.11,<5",
  "pytest-cov>=7.1,<8",
  "ruff>=0.16,<0.17",
  "mypy>=2.3,<2.4",
  "django-stubs>=6.1,<6.2",
]

[tool.setuptools]
py-modules = []

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py", "*_tests.py"]
addopts = "-ra --strict-markers"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["**/migrations/*.py"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]

[tool.mypy]
python_version = "3.12"
plugins = ["mypy_django_plugin.main"]
ignore_missing_imports = true
check_untyped_defs = true
exclude = "(^|/)migrations/"

[tool.django-stubs]
django_settings_module = "config.settings"
